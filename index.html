<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
</head>
<body>
<meta charset="utf-8">
<title>Idu Practice</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Nunito+Sans:wght@400;500;600;700&family=Lora:wght@400;500;600;700&display=swap">
<style>
/* Layout: a showroom (pitch + branding controls) beside a phone that holds the white-label widget; on phones the widget fills the screen. */
:root{
  --bg:#eef0f3; --surface:#ffffff; --surface-2:#f5f6f8; --line:#e3e6eb;
  --fg:#0f1419; --muted:#5f6b7a; --faint:#8a95a3;
  --up:#0b8a5f; --down:#d43d46; --warn:#a86a00;
  --brand:#0d7c86; --brand-ink:#ffffff;
  --shadow:0 30px 80px -30px rgba(15,25,40,.35), 0 0 0 1px rgba(15,25,40,.06);
  --font:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:16px;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0e12; --surface:#13171c; --surface-2:#1a1f26; --line:#262c35;
  --fg:#eef1f5; --muted:#9aa5b3; --faint:#6c7786;
  --up:#3fcf8e; --down:#ff6b72; --warn:#e2a93b;
  --shadow:0 30px 80px -30px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.07);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0b0e12; --surface:#13171c; --surface-2:#1a1f26; --line:#262c35;
  --fg:#eef1f5; --muted:#9aa5b3; --faint:#6c7786;
  --up:#3fcf8e; --down:#ff6b72; --warn:#e2a93b;
  --shadow:0 30px 80px -30px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.07);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  color-scheme:dark;}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)}

/* ---------- showroom ---------- */
.stage{min-height:100%;display:grid;grid-template-columns:minmax(0,420px) auto;gap:72px;align-items:center;justify-content:center;padding-block:40px}
.pitch{display:flex;flex-direction:column;gap:22px;min-width:0}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pitch h1{font-size:40px;line-height:1.08;letter-spacing:-.025em;font-weight:600;margin:0;text-wrap:balance}
.pitch p{margin:0;color:var(--muted);max-width:40ch}
.points{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.points li{display:grid;grid-template-columns:22px 1fr;gap:10px;color:var(--fg)}
.points li span{color:var(--muted)}
.points svg{margin-top:3px;color:var(--brand)}
.controls{display:flex;flex-direction:column;gap:10px;padding-top:6px;border-top:1px solid var(--line)}
.controls-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.label{font-size:13px;color:var(--muted)}
.swatches{display:flex;gap:8px}
.swatch{width:28px;height:28px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--c)}
.seg{display:flex;flex-wrap:wrap;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button.up{display:inline-flex;align-items:center;gap:5px}
.seg button{font-size:13px;font-weight:600;padding:5px 12px;border-radius:8px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 0 0 1px var(--line)}
.linkbtn{font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.foot{font-size:12px;color:var(--faint);max-width:44ch}

.phone{width:392px;height:820px;border-radius:52px;background:var(--surface);box-shadow:var(--shadow);padding:10px;position:relative}
.screen{font-family:var(--wfont, var(--font));width:100%;height:100%;border-radius:43px;overflow:hidden;background:var(--surface);position:relative;display:flex;flex-direction:column;
  box-shadow:inset 0 0 0 1px var(--line)}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:110px;height:30px;background:#05070a;border-radius:20px;z-index:5}

@media (max-width:900px){
  .stage{grid-template-columns:minmax(0,1fr);gap:28px;padding-block:24px;justify-items:center}
  .phone{max-width:100%;min-width:0}
  .pitch{max-width:520px}
  .pitch h1{font-size:30px}
}
@media (max-width:520px){
  body{padding-left:0;padding-right:0}
  .stage{padding-block:0;gap:0}
  .pitch{order:2;padding:24px max(16px, env(safe-area-inset-left, 0px)) 32px}
  .pitch h1,.points,.pitch>p{display:none}
  .phone{width:100%;height:100dvh;border-radius:0;padding:0;box-shadow:none;order:1}
  .screen{border-radius:0;box-shadow:none}
  .notch{display:none}
}

/* ---------- widget ---------- */
.w-head{padding:52px 20px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
@media (max-width:520px){.w-head{padding-top:calc(14px + env(safe-area-inset-top, 0px))}}
.brandmark{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.logo{width:40px;height:32px;border-radius:9px;border:1.5px dashed var(--brand);color:var(--brand);display:grid;place-items:center;text-align:center;font-size:8.5px;line-height:1.05;font-weight:600;text-transform:uppercase;letter-spacing:.04em;white-space:pre-line}
.go{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:6px 10px 6px 12px;border-radius:99px;background:var(--brand);color:var(--brand-ink);white-space:nowrap}
.go:hover{filter:brightness(1.08)}
.go{flex:none}
.brandmark{min-width:0}
.brandmark span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.15}
.logo{flex:none}
.tabs{position:relative;display:flex;gap:2px;margin:4px 20px 0;background:var(--surface-2);border-radius:12px;padding:3px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity}
/* fade the right edge only while more tabs are hidden there */
.tabs.more{-webkit-mask-image:linear-gradient(90deg,#000 80%,transparent);mask-image:linear-gradient(90deg,#000 80%,transparent)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;padding:8px 12px;border-radius:9px;font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap;scroll-snap-align:start}
.tab[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line)}
.tab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--down);margin-left:5px;vertical-align:2px}
.view{position:relative;flex:1;overflow-y:auto;padding:18px 20px 28px;display:flex;flex-direction:column;gap:18px;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.view>*,.s-body>*{flex-shrink:0}

.kicker{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.big{font-size:36px;font-weight:600;letter-spacing:-.03em;line-height:1.1}
.delta{font-size:14px;font-weight:500}
.chart{position:relative;touch-action:pan-y;user-select:none}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.ranges{display:flex;gap:4px}
.range{flex:1;font-size:13px;font-weight:500;padding:6px 0;border-radius:8px;color:var(--muted)}
.range[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}

.section-title{color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-family:var(--mono);font-weight:500;font-size:11px}
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;text-align:left;border-bottom:1px solid var(--line);width:100%}
.row:last-child{border-bottom:0}
.tick{width:38px;height:38px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--mono);font-size:10px;font-weight:500;color:var(--fg);letter-spacing:-.02em;overflow:hidden}
.r-name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-val{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.r-val b{font-weight:500}
.r-val span{font-size:13px}
.spark{width:56px;height:24px}

/* portfolio charts */
.legend-inline{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend-inline i{display:inline-block;width:14px;height:0;border-top:2px solid var(--c);vertical-align:3px;margin-right:6px}
.legend-inline i.dash{border-top-style:dashed}
.legend-inline b{color:var(--fg);font-weight:500}
.alloc{display:grid;grid-template-columns:132px minmax(0,1fr);gap:18px;align-items:center}
.donut{position:relative;width:132px;height:132px}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut-c b{font-size:18px;font-weight:600;letter-spacing:-.02em}
.donut-c span{font-size:11px;color:var(--muted)}
.lg{display:flex;flex-direction:column;gap:7px;font-size:13px;min-width:0}
.lg div{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center}
.lg i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.lg span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg em{font-style:normal;color:var(--muted)}
.gains{display:flex;flex-direction:column;gap:9px}
.gain{display:grid;grid-template-columns:72px minmax(0,1fr) 76px;gap:10px;align-items:center;font-size:13px}
.gain>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.gbar{position:relative;height:10px}
.gbar::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line)}
.gbar i{position:absolute;top:0;height:10px;border-radius:4px}
.gain b{text-align:right;font-weight:500}
.note{font-size:14px;color:var(--muted);margin:0;padding:24px 0;text-align:center}

/* builder */
.result{padding:16px;border-radius:var(--r);background:color-mix(in srgb,var(--brand) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--brand) 22%,transparent);display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:12px;align-items:center}
.result .k{font-size:13px;color:var(--muted)}
.result .v{font-size:26px;font-weight:600;letter-spacing:-.02em}
.result svg{width:96px;height:40px}
.pick{display:grid;grid-template-columns:22px 38px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.pick:last-child{border-bottom:0}
.check{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--brand-ink)}
.pick[aria-pressed="true"] .check{background:var(--brand);border-color:var(--brand)}
.step{display:flex;align-items:center;gap:6px}
.step button{width:28px;height:28px;border-radius:8px;background:var(--surface-2);font-size:16px;font-weight:600;color:var(--fg)}
.step b{min-width:62px;text-align:center;font-weight:500;font-size:14px}
.sticky{position:sticky;bottom:-28px;margin:0 -20px -28px;padding:12px 20px 20px;background:linear-gradient(transparent,var(--surface) 30%)}
.sticky .btn{width:100%;padding:14px 0;font-size:15px}

.cta{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:16px;border-radius:var(--r);background:color-mix(in srgb,var(--brand) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--brand) 22%,transparent)}
.cta b{display:block;font-weight:600}
.cta span{font-size:13px;color:var(--muted)}
.btn{background:var(--brand);color:var(--brand-ink);font-weight:600;font-size:14px;padding:10px 16px;border-radius:12px;white-space:nowrap}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn:active{transform:scale(.98)}

/* moves */
.intro{font-size:14px;color:var(--muted);margin:0}
.move{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:var(--r);border:1px solid var(--line);text-align:left;width:100%;background:var(--surface)}
.move:hover{border-color:color-mix(in srgb,var(--fg) 20%,var(--line))}
.m-top{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:12px;align-items:center}
.drop{font-size:20px;font-weight:600;letter-spacing:-.02em;color:var(--down)}
.cause{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--fg);width:max-content}
.cause i{width:6px;height:6px;border-radius:50%;background:var(--c,var(--muted))}
.m-text{font-size:14px;margin:0;color:var(--fg)}
.m-foot{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}

/* markets */
.search{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:12px;padding:0 12px}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--fg);padding:10px 0;outline:none}
.search svg{color:var(--faint);flex:none}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px}
.chips::-webkit-scrollbar{display:none}
.chip{font-size:13px;font-weight:500;padding:6px 12px;border-radius:99px;border:1px solid var(--line);white-space:nowrap;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:24px 0}

/* sheet */
.scrim{position:absolute;inset:0;background:rgba(5,8,12,.42);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;background:var(--surface);border-radius:24px 24px 0 0;z-index:11;transform:translateY(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.sheet.open{transform:none}
.grab{width:38px;height:5px;border-radius:9px;background:var(--line);margin:8px auto 0;flex:none}
.s-body{overflow-y:auto;padding:12px 20px calc(24px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:16px;scrollbar-width:none}
.s-body::-webkit-scrollbar{display:none}
.s-head{display:grid;grid-template-columns:38px minmax(0,1fr) 32px;gap:12px;align-items:center}
.close{width:32px;height:32px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.box{padding:14px;border-radius:14px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px}
.box h3{margin:0;font-size:13px;font-weight:600}
.box p{margin:0;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat b{display:block;font-size:20px;font-weight:600;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted);line-height:1.3;display:block}
.bar{display:flex;height:8px;border-radius:9px;overflow:hidden;gap:2px}
.bar i{display:block}
.whatif{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.whatif b{font-size:20px;font-weight:600;letter-spacing:-.02em}
.whatif>span:first-child{color:var(--muted);font-size:14px}
.whatif small{font-size:13px;font-weight:500;margin-left:6px}
.tocust{width:100%;padding:13px 0}
.pick.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,40%{background:color-mix(in srgb,var(--brand) 16%,transparent)}100%{background:transparent}}
.held{display:flex;justify-content:space-between;align-items:center;font-size:14px;gap:10px}
.sources{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.sources a{color:var(--muted)}
.fine{font-size:12px;color:var(--faint);margin:0}

.toast{position:absolute;left:16px;right:16px;bottom:calc(18px + env(safe-area-inset-bottom, 0px));background:var(--fg);color:var(--surface);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;z-index:20;transform:translateY(20px);opacity:0;visibility:hidden;transition:transform .25s,opacity .25s,visibility .25s}
.toast.show{transform:none;opacity:1;visibility:visible}
.toast button{font-weight:600;color:color-mix(in srgb,var(--brand) 55%,var(--surface))}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<main class="stage">
  <section class="pitch">
    <div class="eyebrow" data-i18n="eyebrow"></div>
    <h1 data-i18n="h1"></h1>
    <p data-i18n="lede"></p>
    <ul class="points">
      <li><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3 3 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><div><b data-i18n="p1" style="font-weight:500"></b> <span data-i18n="p1s"></span></div></li>
      <li><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3 3 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><div><b data-i18n="p2" style="font-weight:500"></b> <span data-i18n="p2s"></span></div></li>
      <li><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3 3 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><div><b data-i18n="p3" style="font-weight:500"></b> <span data-i18n="p3s"></span></div></li>
    </ul>
    <div class="controls">
      <div class="controls-row">
        <span class="label" data-i18n="language"></span>
        <div class="seg" id="lang"></div>
      </div>
      <div class="controls-row">
        <span class="label" data-i18n="brand"></span>
        <div class="swatches" id="swatches"></div>
      </div>
      <div class="controls-row">
        <span class="label" data-i18n="font"></span>
        <div class="seg" id="fonts"></div>
        <input type="file" id="fontFile" accept=".woff2,.woff,.ttf,.otf" hidden>
      </div>
      <div class="controls-row">
        <span class="label" data-i18n="started"></span>
        <button class="linkbtn" id="reset" data-i18n="reset"></button>
      </div>
    </div>
    <p class="foot" data-i18n="foot"></p>
  </section>

  <div class="phone">
    <div class="screen" id="screen">
      <div class="notch"></div>
      <header class="w-head">
        <div class="brandmark"><div class="logo" data-i18n="logo"></div><span data-i18n="title"></span></div>
        <button class="go" data-cta><span data-i18n="goReal"></span><svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M4.5 2.5L8 6l-3.5 3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </header>
      <nav class="tabs" role="tablist" id="tabs">
        <button class="tab" role="tab" data-tab="portfolio" aria-selected="true"><span data-i18n="tPortfolio"></span></button>
        <button class="tab" role="tab" data-tab="build" aria-selected="false"><span data-i18n="tBuild"></span></button>
        <button class="tab" role="tab" data-tab="moves" aria-selected="false"><span data-i18n="tMoves"></span><span class="dot"></span></button>
        <button class="tab" role="tab" data-tab="markets" aria-selected="false"><span data-i18n="tMarkets"></span></button>

  sv:'Konstruerar grafikchip, först för spel och nu främst för AI-datacenter. De flesta stora AI-modeller tränas på dess processorer.',
  no:'Utvikler grafikkbrikker, først for spill og nå mest for KI-datasentre. De fleste store KI-modeller trenes på prosessorene deres.',

 AMZN:{en:'Runs the world’s largest online store and the Prime subscription. Its cloud arm, Amazon Web Services, earns most of its profit.',

 GOOGL:{en:'Parent company of Google. Earns mostly from search and YouTube advertising, and also runs Android and Google Cloud.',

 META:{en:'Owns Facebook, Instagram and WhatsApp. Earns almost all of its money from advertising and invests heavily in AI and virtual reality.',

 TSLA:{en:'Makes electric cars and batteries, and sells energy storage for homes and power grids. Its share price often moves sharply on news.',

  fi:'Valmistaa sähköautoja ja akkuja sekä myy energiavarastoja koteihin ja sähköverkkoihin. Osakkeen hinta liikkuu uutisten mukana usein voimakkaasti.',

 KO:{en:'Sells soft drinks such as Coca-Cola, Fanta and Sprite in more than 200 countries. Seen as a steady company that pays a dividend every quarter.',

/* backtest: S&P 500, 2015–2026, drop of 20%+ from a 60-day high, outcome 6 months later */
const HIST = {n:4354, higher:.677, median:.112, further:.096};

/* ---------- state ---------- */
const KEY = 'idu-demo-v4';
const SEED_DATE = '2026-05-04';
/* starter portfolio: 4 positions x 20% + 20% cash, picked to be in profit so a first-time visitor starts green */
const seed = () => { const i = idx(SEED_DATE);
  return [['EUNL',2000],['GOOGL',2000],['SAP',2000],['GOLD',2000]].map(([sym,amt]) => ({type:'buy',sym,i,eur:amt,units:amt/pe(sym,i),src:'b'})); };
let tx;
try { tx = JSON.parse(localStorage.getItem(KEY)) || seed(); } catch(e) { tx = seed(); }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(tx)); } catch(e) {} };
const startIdx = () => Math.min(...tx.map(t => t.i), LAST);

function positions(at = LAST){
  const u = {}, cost = {};
  let cash = START_CASH;
  for (const t of tx) { if (t.i > at) continue;
    if (t.type === 'buy') { u[t.sym] = (u[t.sym]||0) + t.units; cost[t.sym] = (cost[t.sym]||0) + t.eur; cash -= t.eur; }
    else { cash += (u[t.sym]||0) * pe(t.sym, t.i); cost[t.sym] = 0; u[t.sym] = 0; } }
  return {u, cost, cash};
}
function valueAt(i){ const {u, cash} = positions(i); let v = cash; for (const s in u) if (u[s] > 1e-9) v += u[s]*pe(s,i); return v; }

/* ---------- charts ---------- */
let gid = 0;
function chartSVG(vals, {w=350, h=150, color='var(--brand)', marker=null, pad=8, ref=null}={}){
  const all = ref ? vals.concat(ref) : vals;
  const min = Math.min(...all), max = Math.max(...all), span = (max-min)||1;
  const X = i => (i/(vals.length-1||1))*w, Y = v => pad + (1-(v-min)/span)*(h-2*pad);
  const d = vals.map((v,i) => (i?'L':'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join('');
  const id = 'g' + (++gid);
  let extra = '';
  if (ref) extra += `<path d="${ref.map((v,i) => (i?'L':'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join('')}" fill="none" stroke="var(--faint)" stroke-width="1.5" stroke-dasharray="4 4"/>`;
  if (marker != null) extra += `<line x1="${X(marker)}" x2="${X(marker)}" y1="${pad}" y2="${h-pad}" stroke="var(--faint)" stroke-dasharray="2 3"/><circle cx="${X(marker)}" cy="${Y(vals[marker])}" r="4.5" fill="var(--down)" stroke="var(--surface)" stroke-width="2"/>`;
  return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${T().chartA}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".22"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>${extra}<path d="${d}L${w} ${h}L0 ${h}Z" fill="url(#${id})"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><g class="cursor" visibility="hidden"><line y1="0" y2="${h}" stroke="var(--faint)"/><circle r="4.5" fill="${color}" stroke="var(--surface)" stroke-width="2"/></g></svg>`;
}
const spark = vals => { const c = vals[vals.length-1] >= vals[0] ? 'var(--up)' : 'var(--down)';
  const min=Math.min(...vals), max=Math.max(...vals), s=(max-min)||1;
  const d = vals.map((v,i)=>(i?'L':'M')+(i/(vals.length-1)*56).toFixed(1)+' '+(22-(v-min)/s*20).toFixed(1)).join('');
  return `<svg class="spark" viewBox="0 0 56 24" aria-hidden="true"><path d="${d}" fill="none" stroke="${c}" stroke-width="1.6" stroke-linejoin="round"/></svg>`; };

/* scrub: drag across a chart to read a past value */
function scrub(el, vals, onMove, scaleVals=vals, w=350, h=150, pad=8){
  const svg = el.querySelector('svg'), cur = svg.querySelector('.cursor');
  const min = Math.min(...scaleVals), max = Math.max(...scaleVals), span=(max-min)||1;
  const move = e => { const r = svg.getBoundingClientRect(); const x = Math.max(0, Math.min(1, (e.clientX - r.left)/r.width));
    const i = Math.round(x*(vals.length-1)); const cx = i/(vals.length-1)*w, cy = pad + (1-(vals[i]-min)/span)*(h-2*pad);
    cur.setAttribute('visibility','visible'); cur.querySelector('line').setAttribute('x1',cx); cur.querySelector('line').setAttribute('x2',cx);
    cur.querySelector('circle').setAttribute('cx',cx); cur.querySelector('circle').setAttribute('cy',cy); onMove(i); };
  const end = () => { cur.setAttribute('visibility','hidden'); onMove(null); };
  el.addEventListener('pointermove', move); el.addEventListener('pointerdown', move);
  el.addEventListener('pointerleave', end); el.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') end(); });
}

/* ---------- views ---------- */
const view = document.getElementById('view');
let tab = 'portfolio', pRange = 'all', mFilter = 'All', mQuery = '';
const tick = s => `<div class="tick">${esc(s.length>5?s.slice(0,4):s)}</div>`;

function renderPortfolio(){
  const t = T();
  const {u, cost, cash} = positions();
  const total = valueAt(LAST), gain = total - START_CASH;
  const from = pRange === 'all' ? startIdx() : Math.max(startIdx(), monthsAgo(pRange === '1m' ? 1 : 3));
  const series = []; for (let i = from; i <= LAST; i++) series.push(valueAt(i));
  const held = Object.keys(u).filter(s => u[s] > 1e-9).map(s => ({s, v:u[s]*pe(s,LAST), c:cost[s]})).sort((a,b) => b.v - a.v);
  const restDelta = () => `${signed(gain)} · ${pct(gain/START_CASH)} ${t.since(fmtDate(DATES[startIdx()], DATES[startIdx()].slice(0,4) !== DATES[LAST].slice(0,4)))}`;
  // benchmark: the same starting value put into a world-index ETF on the first day of the range
  const ref = series.map((_, k) => series[0] * pe('EUNL', from+k) / pe('EUNL', from));
  const youR = series[series.length-1]/series[0]-1, refR = ref[ref.length-1]/ref[0]-1;
  // allocation: colour follows the holding (order of first purchase), never its rank
  const order = [...new Set(tx.map(x => x.sym))];
  const colOf = s => PAL[order.indexOf(s) % PAL.length];
  const slices = held.map(h => ({name:BY[h.s].name, v:h.v, c:colOf(h.s)})).concat(cash > 0.5 ? [{name:t.cash, v:cash, c:'var(--faint)'}] : []);
  const R = 52, C = 2*Math.PI*R, GAP = slices.length > 1 ? 2.5 : 0;
  let acc = 0;
  const arcs = slices.map(s => { const len = s.v/total*C, a = acc; acc += len;
    return `<circle r="${R}" cx="66" cy="66" fill="none" stroke="${s.c}" stroke-width="16" stroke-dasharray="${Math.max(0,len-GAP)} ${C}" stroke-dashoffset="${-a}"><title>${esc(s.name)}: ${eur(s.v)}</title></circle>`; }).join('');
  const gl = held.map(h => ({s:h.s, g:h.v-h.c})), gmax = Math.max(...gl.map(x => Math.abs(x.g)), 1);
  const gainsHTML = gl.some(x => Math.abs(x.g) >= 0.01) ? `
    <div class="section-title">${t.gains}</div>
    <div class="gains">${gl.sort((a,b) => b.g - a.g).map(x => { const w = Math.abs(x.g)/gmax*50;
      return `<div class="gain" title="${esc(BY[x.s].name)}: ${signed(x.g)}"><span>${esc(BY[x.s].name)}</span><div class="gbar"><i style="${x.g>=0?`left:50%`:`right:50%`};width:${w}%;background:${x.g>=0?'var(--up)':'var(--down)'}"></i></div><b class="num">${signed(x.g)}</b></div>`; }).join('')}</div>` : '';
  view.innerHTML = `
    <div>
      <div class="kicker"><span id="pLabel">${t.total}</span><span class="num">${t.startedWith(eur0(START_CASH))}</span></div>
      <div class="big num" id="pBig">${eur(total)}</div>
      <div class="delta num ${cls(gain)}" id="pDelta">${restDelta()}</div>
    </div>
    ${series.length > 1 ? `
    <div class="chart" id="pChart">${chartSVG(series, {color: series[series.length-1] >= series[0] ? 'var(--up)' : 'var(--down)', ref})}</div>
    <div class="legend-inline num" id="pLegend"><span><i style="--c:${series[series.length-1] >= series[0] ? 'var(--up)' : 'var(--down)'}"></i>${t.you} <b>${pct(youR)}</b></span><span><i class="dash" style="--c:var(--faint)"></i>${t.world} <b>${pct(refR)}</b></span></div>
    <div class="ranges">${[['1m',t.r1m],['3m',t.r3m],['all',t.rAll]].map(([k,l]) => `<button class="range" data-range="${k}" aria-pressed="${pRange===k}">${l}</button>`).join('')}</div>` : `<p class="note">${t.startsToday}</p>`}
    <div class="section-title">${t.allocation}</div>
    <div class="alloc">
      <div class="donut"><svg viewBox="0 0 132 132" aria-hidden="true">${arcs}</svg><div class="donut-c"><b class="num">${held.length}</b><span>${t.positions(held.length).replace(/^\d+\s/,'')}</span></div></div>
      <div class="lg num">${slices.map(s => `<div><i style="--c:${s.c}"></i><span>${esc(s.name)}</span><em>${dec(s.v/total*100,0)}%</em></div>`).join('')}</div>
    </div>
    ${gainsHTML}
    <div class="section-title">${t.holdings}</div>
    <div class="list">
      ${held.map(h => `<button class="row" data-open="${h.s}">${tick(h.s)}<div style="min-width:0"><div class="r-name">${esc(BY[h.s].name)}</div><div class="r-sub num">${dec(u[h.s], u[h.s]<10?3:1)} ${t.units}</div></div><div class="r-val num"><b>${eur(h.v)}</b><span class="${cls(h.v-h.c)}">${pct(h.v/h.c-1)}</span></div></button>`).join('')}
      <div class="row" style="cursor:default"><div class="tick">€</div><div><div class="r-name">${t.cash}</div><div class="r-sub">${t.cashSub}</div></div><div class="r-val num"><b>${eur(cash)}</b></div></div>
    </div>
    <div class="cta"><div><b>${t.ctaT}</b><span>${t.ctaS}</span></div><button class="btn" data-cta>${t.ctaB}</button></div>`;
  if (series.length < 2) return;
  const big = view.querySelector('#pBig'), lab = view.querySelector('#pLabel'), dl = view.querySelector('#pDelta'), lgB = view.querySelectorAll('#pLegend b');
  scrub(view.querySelector('#pChart'), series, i => {
    if (i == null) { big.textContent = eur(total); lab.textContent = t.total; dl.textContent = restDelta(); dl.className = 'delta num ' + cls(gain); lgB[0].textContent = pct(youR); lgB[1].textContent = pct(refR); return; }
    const v = series[i], g = v - START_CASH; big.textContent = eur(v); lab.textContent = fmtDate(DATES[from+i]);
    dl.textContent = `${signed(g)} · ${pct(g/START_CASH)}`; dl.className = 'delta num ' + cls(g);
    lgB[0].textContent = pct(series[i]/series[0]-1); lgB[1].textContent = pct(ref[i]/ref[0]-1); }, series.concat(ref));
}

/* ---------- builder ---------- */
const PRESETS = {safe:['EUNL','SXR8','GOLD','KO'], tech:['AAPL','MSFT','NVDA','GOOGL','ASML'], home:['LHV','TAL','TKM','EUNL']};
let bStartPref = 6;
const START_OPTS = [0,3,6,12];
const equalSplit = (syms, budget) => { const each = syms.length ? Math.floor(budget/syms.length/50)*50 : 0; const o = {}; if (each > 0) syms.forEach(s => o[s] = each); return o; };
/* The builder is a view of the portfolio: lots tagged src:'b' are the builder's picks; trades from Markets/Moves stay as they are. */
function buildState(){
  const lots = tx.filter(x => x.src === 'b'), {u} = positions(), alloc = {};
  lots.forEach(l => { if ((u[l.sym]||0) > 1e-9) alloc[l.sym] = (alloc[l.sym]||0) + l.eur; });
  let bStart = bStartPref;
  if (lots.length){ const m = (new Date(DATES[LAST]) - new Date(DATES[lots[0].i])) / (30.44*864e5); bStart = START_OPTS.reduce((a,b) => Math.abs(b-m) < Math.abs(a-m) ? b : a); }
  const otherBuys = tx.filter(x => x.src !== 'b' && x.type === 'buy').reduce((a,x) => a + x.eur, 0);
  return {alloc, bStart, budget: START_CASH - otherBuys};
}
function applyBuild(alloc, bStart){
  bStartPref = bStart;
  const si = bStart ? monthsAgo(bStart) : LAST;
  const keep = tx.filter(x => x.src !== 'b' && !(x.type === 'sell' && alloc[x.sym] != null));   // re-picking a sold stock re-opens it
  tx = Object.keys(alloc).filter(s => alloc[s] > 0).map(s => ({type:'buy', sym:s, i:si, eur:alloc[s], units:alloc[s]/pe(s,si), src:'b'})).concat(keep);
  save(); render();
}
function renderBuild(){
  const t = T();
  const st = buildState(), bSel = st.alloc, bStart = st.bStart;
  const si = bStart ? monthsAgo(bStart) : LAST;
  const syms = Object.keys(bSel), used = syms.reduce((a,s) => a + bSel[s], 0), cash = START_CASH - used;
  const series = []; for (let i = si; i <= LAST; i++) series.push(cash + syms.reduce((a,s) => a + bSel[s]*pe(s,i)/pe(s,si), 0));
  const worth = series[series.length-1];
  view.innerHTML = `
    <p class="intro">${t.bIntro}</p>
    <div class="result">
      <div><div class="k">${bStart ? t.worthIf(fmtDate(DATES[si])) : t.investedToday}</div><div class="v num">${eur0(worth)}</div>
        ${bStart ? `<div class="delta num ${cls(worth-START_CASH)}">${signed(worth-START_CASH)} · ${pct(worth/START_CASH-1)}</div>` : ''}</div>
      ${series.length > 1 ? spark(series).replace('class="spark"','') : ''}
    </div>
    <div class="section-title">${t.bStart}</div>
    <div class="chips">${[0,3,6,12].map(k => `<button class="chip" data-bstart="${k}" aria-pressed="${bStart===k}">${t.starts[k]}</button>`).join('')}</div>
    <div class="section-title">${t.presets}</div>
    <div class="chips">${Object.keys(PRESETS).map(k => `<button class="chip" data-preset="${k}" aria-pressed="${PRESETS[k].length===syms.length && PRESETS[k].every(s => bSel[s] != null)}">${t.presetNames[k]}</button>`).join('')}</div>
    <div class="list">${CATALOG.map(x => { const on = bSel[x.sym] != null;
      return `<div class="pick" role="button" tabindex="0" data-bpick="${x.sym}" aria-pressed="${on}"><span class="check"><svg width="12" height="12" viewBox="0 0 16 16" fill="none"${on?'':' hidden'}><path d="M3 8.5l3 3 7-7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>${tick(x.sym)}<div style="min-width:0"><div class="r-name">${esc(x.name)}</div><div class="r-sub">${esc(t.groups[x.group])}</div></div>
        ${on ? `<div class="step num"><button data-bstep="${x.sym}" data-d="-250" aria-label="${t.less}">−</button><b>${eur0(bSel[x.sym])}</b><button data-bstep="${x.sym}" data-d="250" aria-label="${t.more}">+</button></div>` : ''}</div>`; }).join('')}</div>
    <div class="sticky"><p class="fine" style="text-align:center;padding-bottom:8px">${t.synced} · ${t.cashLeft(eur0(st.budget - used))}</p><button class="btn" data-use>${t.use}</button></div>`;
}

function moveCard(m){
  const t = T(), i = idx(m.date), since = px(m.sym, LAST)/px(m.sym, i) - 1;
  const a = Math.max(0, i - 60), vals = BY[m.sym].p.slice(a, LAST+1);
  return `<button class="move" data-move="${m.sym}">
    <div class="m-top">${tick(m.sym)}<div style="min-width:0"><div class="r-name">${esc(BY[m.sym].name)}</div><div class="r-sub">${fmtDate(m.date)}</div></div><div class="drop num">${pct(m.drop)}</div></div>
    <span class="cause" style="--c:${CAUSE_C[m.cause]}"><i></i>${t.causes[m.cause]}</span>
    <p class="m-text">${esc(m[lang].text)}</p>
    <div class="chart">${chartSVG(vals, {h:70, color:'var(--muted)', marker:i-a, pad:6})}</div>
    <div class="m-foot"><span>${t.fromHigh}</span><span class="num">${i >= LAST ? t.latest : `${t.sinceThen} <b class="${cls(since)}">${pct(since)}</b>`}</span></div>
  </button>`;
}
function renderMoves(){
  view.innerHTML = `<p class="intro">${T().intro}</p>${MOVES.map(moveCard).join('')}`;
}

function renderMarkets(){
  const t = T();
  const groups = ['All', ...new Set(CATALOG.map(x => x.group))];
  const q = mQuery.trim().toLowerCase();
  const list = CATALOG.filter(x => (mFilter === 'All' || x.group === mFilter) && (!q || x.name.toLowerCase().includes(q) || x.sym.toLowerCase().includes(q)));
  const from = monthsAgo(6);
  view.innerHTML = `
    <label class="search"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><input id="q" type="search" placeholder="${t.search}" value="${esc(mQuery)}" aria-label="${t.searchA}"></label>
    <div class="chips">${groups.map(g => `<button class="chip" data-filter="${esc(g)}" aria-pressed="${mFilter===g}">${esc(t.groups[g] || g)}</button>`).join('')}</div>
    <div class="list" id="mlist">${list.length ? list.map(x => { const ch = x.p[LAST]/x.p[from]-1;
      return `<button class="row" data-open="${x.sym}" style="grid-template-columns:38px minmax(0,1fr) 56px 82px">${tick(x.sym)}<div style="min-width:0"><div class="r-name">${esc(x.name)}</div><div class="r-sub">${esc(x.sym)} · ${x.ccy}</div></div>${spark(x.p.slice(from))}<div class="r-val num"><b>${native(x.p[LAST], x.ccy)}</b><span class="${cls(ch)}">${pct(ch)}</span></div></button>`; }).join('') : `<div class="empty">${esc(t.nothing(mQuery))}</div>`}</div>
    <p class="fine">${t.sixM}</p>`;
  const inp = view.querySelector('#q');
  inp.addEventListener('input', () => { mQuery = inp.value; const pos = inp.selectionStart; renderMarkets(); const n = view.querySelector('#q'); n.focus(); n.setSelectionRange(pos,pos); });
}

const RENDER = {portfolio:renderPortfolio, build:renderBuild, moves:renderMoves, markets:renderMarkets};
function render(){ RENDER[tab](); }
function selectTab(name){
  tab = name;
  document.querySelectorAll('.tab').forEach(b => { const on = b.dataset.tab === name; b.setAttribute('aria-selected', on);
    if (on) { const l = b.offsetLeft, r = l + b.offsetWidth;   // bring the chosen tab fully into view, without moving the page
      if (r > tabsEl.scrollLeft + tabsEl.clientWidth) tabsEl.scrollTo({left: r - tabsEl.clientWidth + 8, behavior:'smooth'});
      else if (l < tabsEl.scrollLeft) tabsEl.scrollTo({left: Math.max(0, l - 8), behavior:'smooth'}); } });
  if (name === 'moves') document.querySelector('.tab .dot')?.remove();
  view.scrollTop = 0; render();
}
const tabsEl = document.getElementById('tabs');
const tabsFade = () => tabsEl.classList.toggle('more', tabsEl.scrollLeft + tabsEl.clientWidth < tabsEl.scrollWidth - 2);
tabsEl.addEventListener('scroll', tabsFade); window.addEventListener('resize', tabsFade);
/* categorical palette, fixed order (validated set); slot colours switch with the theme */
const PAL = ['var(--s1)','var(--s2)','var(--s3)','var(--s4)','var(--s5)','var(--s6)','var(--s7)','var(--s8)'];

/* ---------- sheet ---------- */
const sheet = document.getElementById('sheet'), scrim = document.getElementById('scrim'), sbody = document.getElementById('sbody');
let sheetSym = null, sheetMove = null, iRange = 12;
function openSheet(sym, move=null){ sheetSym = sym; sheetMove = move; iRange = 12; renderSheet(); sheet.classList.add('open'); scrim.classList.add('open'); sbody.scrollTop = 0; setTimeout(() => sbody.querySelector('.close')?.focus({preventScroll:true}), 50); }
function closeSheet(){ sheet.classList.remove('open'); scrim.classList.remove('open'); sheetSym = null; }

function renderSheet(){
  if (!sheetSym) return;
  const t = T(), x = BY[sheetSym], m = sheetMove;
  const from = iRange === 60 ? 0 : monthsAgo(iRange), vals = x.p.slice(from), ch = x.p[LAST]/x.p[from]-1;
  const whatIf = 1000 * pe(x.sym, LAST) / pe(x.sym, from);
  const {u, cost} = positions(); const units = u[x.sym] || 0, hv = units * pe(x.sym, LAST);
  const mi = m ? idx(m.date) - from : null;
  const hist = m ? `
    <div class="box">
      <h3>${t.histT}</h3>
      <div class="stats num">
        <div class="stat"><b class="up">${Math.round(HIST.higher*100)}%</b><span>${t.higher}</span></div>
        <div class="stat"><b>${pct(HIST.median)}</b><span>${t.median}</span></div>
        <div class="stat"><b class="down">${Math.round(HIST.further*100)}%</b><span>${t.further}</span></div>
      </div>
      <div class="bar" aria-hidden="true"><i style="flex:${HIST.higher};background:var(--up)"></i><i style="flex:${1-HIST.higher-HIST.further};background:var(--faint)"></i><i style="flex:${HIST.further};background:var(--down)"></i></div>
      <p class="fine">${t.histNote(HIST.n.toLocaleString(LOC()))}</p>
    </div>` : '';
  const why = m ? `
    <span class="cause" style="--c:${CAUSE_C[m.cause]}"><i></i>${t.causes[m.cause]}</span>
    <div class="box"><h3>${t.happened}</h3><p>${esc(m[lang].text)} ${esc(m[lang].more)}</p><p style="color:var(--muted)"><b style="color:var(--fg);font-weight:600">${t.watch}</b> ${esc(m[lang].watch)}</p></div>` : '';
  const wiRow = (label, v) => `<div class="whatif"><span>${label}</span><span class="num" style="white-space:nowrap"><b class="${cls(v-1000)}">${eur0(v)}</b><small class="${cls(v-1000)}">${pct(v/1000-1)}</small></span></div>`;
  const onDrop = m && idx(m.date) < LAST ? wiRow(t.dropLbl(fmtDate(m.date, false)), 1000 * pe(x.sym, LAST) / pe(x.sym, idx(m.date))) : '';
  const buys = tx.filter(z => z.sym === x.sym && z.type === 'buy'), boughtAt = buys.length ? Math.min(...buys.map(z => z.i)) : LAST;
  const restDelta = () => `${pct(ch)} ${t.over(iRange)}`;
  sbody.innerHTML = `
    <div class="s-head">${tick(x.sym)}<div style="min-width:0"><div class="r-name">${esc(x.name)}</div><div class="r-sub">${esc(x.sym)} · ${esc(t.groups[x.group])}</div></div><button class="close" aria-label="${t.closeA}"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M3 3l8 8M11 3l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></div>
    <div>
      <div class="kicker"><span id="sLabel">${t.close(fmtDate(DATES[LAST]))}</span></div>
      <div class="big num" id="sBig">${native(x.p[LAST], x.ccy)}</div>
      <div class="delta num ${cls(ch)}" id="sDelta">${restDelta()}</div>
    </div>
    <div class="chart" id="sChart">${chartSVG(vals, {color: ch>=0?'var(--up)':'var(--down)', marker: mi != null && mi >= 0 ? mi : null})}</div>
    <div class="ranges">${[1,6,12,60].map(k => `<button class="range" data-irange="${k}" aria-pressed="${iRange===k}">${t.ir[k]}</button>`).join('')}</div>
    ${ABOUT[x.sym] ? `<div class="box"><h3>${ABOUT_T[lang]}</h3><p>${esc(ABOUT[x.sym][lang] || ABOUT[x.sym].en)}</p></div>` : ''}
    ${why}
    <div class="box"><h3>${t.whatIfT}</h3>${onDrop}${wiRow(t.ago(iRange, fmtDate(DATES[from])), whatIf)}</div>
    ${hist}
    ${units > 1e-9 ? `<div class="box"><h3>${t.title}</h3><div class="held num"><span>${t.youHold(eur(hv))}</span></div><p class="num ${cls(hv-cost[x.sym])}" style="font-size:13px">${pct(hv/cost[x.sym]-1)} ${t.boughtSince(fmtDate(DATES[boughtAt]))}</p></div>` : ''}
    <button class="btn ghost tocust" data-tocust="${x.sym}">${units > 1e-9 ? t.editIn : t.addIn}</button>
    <p class="fine">${t.fineInfo}</p>
    ${m ? `<div class="sources">${t.sources} ${m.src.map(([n,u]) => `<a href="${u}" target="_blank" rel="noopener">${esc(n)}</a>`).join('')}</div>` : ''}`;
  const big = sbody.querySelector('#sBig'), lab = sbody.querySelector('#sLabel'), dl = sbody.querySelector('#sDelta');
  scrub(sbody.querySelector('#sChart'), vals, i => {
    if (i == null) { big.textContent = native(x.p[LAST], x.ccy); lab.textContent = t.close(fmtDate(DATES[LAST])); dl.textContent = restDelta(); dl.className = 'delta num ' + cls(ch); return; }
    big.textContent = native(vals[i], x.ccy); lab.textContent = fmtDate(DATES[from+i]); const c = x.p[LAST]/vals[i]-1; dl.textContent = `${pct(c)} ${t.toToday}`; dl.className = 'delta num ' + cls(c); });
}

/* ---------- actions ---------- */
const toast = document.getElementById('toast'), toastText = document.getElementById('toastText'), undoBtn = document.getElementById('undo');
let toastTimer, undoSnap = null;
function notify(msg, snap){ toastText.textContent = msg; undoSnap = snap; undoBtn.hidden = !snap; toast.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), 4000); }
undoBtn.addEventListener('click', () => { if (!undoSnap) return; tx = undoSnap; undoSnap = null; save(); render(); renderSheet(); toast.classList.remove('show'); });

/* all buying happens in Customize: the stock card only takes you there and points at the stock */
function openInCustomize(sym){
  closeSheet(); selectTab('build');
  const row = view.querySelector(`[data-bpick="${sym}"]`);
  if (row) { view.scrollTop = row.offsetTop - view.clientHeight/2; row.classList.add('flash'); setTimeout(() => row.classList.remove('flash'), 1700); }
}

document.addEventListener('click', e => {
  const t = e.target.closest('button,[data-open],[data-bpick]'); if (!t) return;
  if (t.dataset.tab) selectTab(t.dataset.tab);
  else if (t.dataset.bstart) { const st = buildState(); applyBuild(st.alloc, +t.dataset.bstart); }
  else if (t.dataset.preset) { const st = buildState(); applyBuild(equalSplit(PRESETS[t.dataset.preset], st.budget), st.bStart); }
  else if (t.dataset.bstep) { const st = buildState(), a = {...st.alloc}, s = t.dataset.bstep, d = +t.dataset.d, used = Object.values(a).reduce((x,y) => x+y, 0);
    const nv = a[s] + (d > 0 ? Math.min(d, st.budget - used) : d);
    if (nv <= 0) delete a[s]; else a[s] = nv; applyBuild(a, st.bStart); }
  else if (t.dataset.bpick) { const st = buildState(), s = t.dataset.bpick, cur = Object.keys(st.alloc);
    applyBuild(equalSplit(st.alloc[s] != null ? cur.filter(x => x !== s) : cur.concat(s), st.budget), st.bStart); }
  else if ('use' in t.dataset) { pRange = 'all'; selectTab('portfolio'); }
  else if (t.dataset.range) { pRange = t.dataset.range; render(); }
  else if (t.dataset.filter) { mFilter = t.dataset.filter; render(); }
  else if (t.dataset.open) openSheet(t.dataset.open);
  else if (t.dataset.move) openSheet(t.dataset.move, MOVES.find(m => m.sym === t.dataset.move));
  else if (t.dataset.irange) { iRange = +t.dataset.irange; renderSheet(); }
  else if (t.dataset.tocust) openInCustomize(t.dataset.tocust);
  else if (t.classList.contains('close')) closeSheet();
  else if ('cta' in t.dataset) notify(T().tCta);
});
scrim.addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheetSym) closeSheet();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('[data-bpick]')) { e.preventDefault(); e.target.click(); } });

/* swipe the sheet down to close */
let y0 = null;
sheet.querySelector('.grab').addEventListener('pointerdown', e => y0 = e.clientY);
sheet.addEventListener('pointerup', e => { if (y0 != null && e.clientY - y0 > 60) closeSheet(); y0 = null; });

/* ---------- branding ---------- */
/* default teal, then the primary colours measured on the target banks' websites (Nov 2026), then neutral dark */
const BRANDS = [['#0d7c86','#fff'],['#3859bb','#fff'],['#e3002c','#fff'],['#004bc5','#fff'],['#111827','#fff']];
const sw = document.getElementById('swatches');
let brandIdx = 0;
const setBrand = k => { brandIdx = k; const [c, ink] = BRANDS[k];
  document.documentElement.style.setProperty('--brand', c); document.documentElement.style.setProperty('--brand-ink', ink); };
/* a link can open the demo in a bank's colour: #c=e3002c (any 6-digit hex) */
{ const c = (HASH.get('c') || '').toLowerCase();
  if (/^[0-9a-f]{6}$/.test(c)) { let k = BRANDS.findIndex(([b]) => b === '#' + c); if (k < 0) k = BRANDS.push(['#' + c, '#fff']) - 1; setBrand(k); } }
const drawSwatches = () => { sw.innerHTML = BRANDS.map(([c],k) => `<button class="swatch" style="--c:${c}" aria-label="${T().brandA(k+1)}" aria-pressed="${k===brandIdx}" data-brand="${k}"></button>`).join(''); };
sw.addEventListener('click', e => { const b = e.target.closest('[data-brand]'); if (!b) return; setBrand(+b.dataset.brand);
  drawSwatches(); e.stopPropagation(); });
document.getElementById('reset').addEventListener('click', e => { e.stopPropagation(); tx = seed(); save(); closeSheet(); bStartPref = 6; pRange = 'all'; selectTab('portfolio'); notify(T().tReset); });

/* ---------- language switch ---------- */
const $lang = document.getElementById('lang');
function applyLang(){
  document.documentElement.lang = lang === 'no' ? 'nb' : lang;
  $lang.innerHTML = LANGS.map(([k,l]) => `<button data-lang="${k}" aria-pressed="${k===lang}" lang="${k === 'no' ? 'nb' : k}">${l}</button>`).join('');
  drawFonts();
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = T()[el.dataset.i18n]; });
  document.querySelectorAll('#lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  drawSwatches(); render(); renderSheet(); tabsFade();
}
/* ---------- bank typography: presets, or the bank's own font file ---------- */
const FONTS = [['Geist','"Geist", ui-sans-serif, system-ui, sans-serif'], ['IBM Plex Sans','"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif'],
  ['Nunito Sans','"Nunito Sans", ui-sans-serif, system-ui, sans-serif'], ['Lora','"Lora", Georgia, serif']];
const screenEl = document.getElementById('screen'), fontsEl = document.getElementById('fonts'), fontFile = document.getElementById('fontFile');
let fontPick = 0, customFont = null;   // customFont = file name of an uploaded font
function drawFonts(){
  fontsEl.innerHTML = FONTS.map(([n,css],k) => `<button data-font="${k}" aria-pressed="${fontPick===k}" style="font-family:${css.replace(/"/g,'&quot;')}">${n.split(' ')[0]}</button>`).join('')
    + (customFont ? `<button data-font="custom" aria-pressed="${fontPick==='custom'}" style="font-family:'BankFont'">${esc(customFont.replace(/\.[^.]+$/,''))}</button>` : '')
    + `<button class="up" data-upload><svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M6 9V2.5M3 5.5l3-3 3 3M2 10.5h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>${T().fontUpload}</button>`;
}
function setFont(k){
  fontPick = k;
  screenEl.style.setProperty('--wfont', k === 'custom' ? `'BankFont', ${FONTS[0][1]}` : FONTS[k][1]);
  drawFonts(); render(); renderSheet();
}
fontsEl.addEventListener('click', e => { e.stopPropagation(); const b = e.target.closest('button'); if (!b) return;
  if ('upload' in b.dataset) fontFile.click(); else setFont(b.dataset.font === 'custom' ? 'custom' : +b.dataset.font); });
fontFile.addEventListener('change', async () => {
  const f = fontFile.files[0]; fontFile.value = ''; if (!f) return;
  try { const face = new FontFace('BankFont', await f.arrayBuffer()); await face.load(); document.fonts.add(face);
    customFont = f.name; setFont('custom'); notify(T().fontLoaded(f.name)); }
  catch(err) { notify(T().fontBad); }
});

document.getElementById('lang').addEventListener('click', e => { const b = e.target.closest('[data-lang]'); if (!b) return; e.stopPropagation();
  lang = b.dataset.lang; try { localStorage.setItem(LANG_KEY, lang); } catch(err) {} applyLang(); });

applyLang();
})();
</script>
